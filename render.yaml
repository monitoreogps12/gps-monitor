services:
  - type: web
    name: gps-sistema
    env: node
    plan: free
    region: oregon
    buildCommand: >
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ pnpm --filter @workspace/gps-admin run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        fromDatabase:
          name: gps-sistema-db
          property: connectionString
      - key: TELEGRAM_CLIENT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SUPPORT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SUPPORT_ADMIN_CHAT_IDS
        sync: false
      - key: GPS_API_URL
        sync: false
      - key: GPS_API_TOKEN
        sync: false

databases:
  - name: gps-sistema-db
    plan: free
    region: oregon
