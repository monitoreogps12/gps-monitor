# =============================================================================
# GPS SISTEMA C.A. — Configuración Nginx para Contabo
#
# Instrucciones:
#   cp deploy/nginx.conf /etc/nginx/sites-available/gpsadmin
#   ln -s /etc/nginx/sites-available/gpsadmin /etc/nginx/sites-enabled/gpsadmin
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Si tienes dominio, luego ejecuta:
#   certbot --nginx -d tudominio.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # Cambia esto por tu dominio o deja la IP si no tienes dominio aún
    server_name _;

    # ── Frontend estático (React build) ──────────────────────────────────────
    root /opt/gpsadmin/artifacts/gps-admin/dist/public;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Cache para assets estáticos con hash (Vite los genera con hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API → proxy al Node.js en puerto 3000 ────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts generosos para las rutas GPS que tardan más
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback: todas las rutas desconocidas → index.html ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar versión de nginx
    server_tokens off;
}
