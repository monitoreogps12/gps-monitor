openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GPS SISTEMA C.A. - Panel Administrativo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gps
    description: GPS fleet tracking operations
  - name: clients
    description: Client management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gps/devices:
    get:
      operationId: listDevices
      tags: [gps]
      summary: List all GPS devices
      description: Returns all tracked vehicles with their status, plates, IMEI, SIM number and last connection
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "503":
          description: Cannot connect to tracking platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gps/devices/live:
    get:
      operationId: getLivePositions
      tags: [gps]
      summary: Get live positions for map
      description: Returns current live GPS positions for all active devices (updated every 2s)
      responses:
        "200":
          description: Live device positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LivePosition"
        "503":
          description: Cannot connect to tracking platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gps/stats:
    get:
      operationId: getFleetStats
      tags: [gps]
      summary: Get fleet statistics
      description: Returns count of devices per status (moving, idle, disconnected, ack, engine_idle)
      responses:
        "200":
          description: Fleet statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetStats"

  /gps/events/recent:
    get:
      operationId: getRecentEvents
      tags: [gps]
      summary: Get recent platform events
      description: Returns up to 100 recent events from rastreoplus247, showing which were dispatched to clients via Telegram
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Recent events feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentEvent"

  /gps/connection:
    get:
      operationId: getConnectionStatus
      tags: [gps]
      summary: Get tracking platform connection status
      description: Returns whether the backend is authenticated with rastreoplus247.com
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients with their vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientWithVehicles"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientWithVehicles"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateClient
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/vehicles:
    post:
      operationId: addClientVehicle
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVehicleInput"
      responses:
        "201":
          description: Vehicle added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientVehicle"

  /clients/{id}/vehicles/{deviceId}:
    delete:
      operationId: removeClientVehicle
      tags: [clients]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Vehicle removed

  /clients/{id}/notify-assignment:
    post:
      operationId: notifyClientAssignment
      tags: [clients]
      summary: Send Telegram notification to client about their assigned vehicles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyAssignmentResult"
        "404":
          description: Client not found

  /clients/{id}/link-telegram:
    post:
      operationId: linkClientTelegram
      tags: [clients]
      summary: Manually link a Telegram ID to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTelegramInput"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Device:
      type: object
      required:
        - id
        - name
        - plate
        - imei
        - simNumber
        - status
        - lastConnection
      properties:
        id:
          type: string
        name:
          type: string
        plate:
          type: string
        imei:
          type: string
        simNumber:
          type: string
        status:
          type: string
          enum: [moving, disconnected_blue, disconnected_red, ack, engine_idle]
        speed:
          type: ["number", "null"]
        lastConnection:
          type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        address:
          type: ["string", "null"]
        driver:
          type: ["string", "null"]

    LivePosition:
      type: object
      required:
        - id
        - name
        - plate
        - status
        - lat
        - lng
      properties:
        id:
          type: string
        name:
          type: string
        plate:
          type: string
        status:
          type: string
          enum: [moving, disconnected_blue, disconnected_red, ack, engine_idle]
        lat:
          type: number
        lng:
          type: number
        speed:
          type: ["number", "null"]
        heading:
          type: ["number", "null"]
        lastConnection:
          type: string
        address:
          type: ["string", "null"]
        imei:
          type: ["string", "null"]
        simNumber:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        driver:
          type: ["string", "null"]

    FleetStats:
      type: object
      required:
        - total
        - moving
        - disconnected
        - ack
        - engineIdle
        - lastUpdated
      properties:
        total:
          type: integer
        moving:
          type: integer
        disconnected:
          type: integer
        ack:
          type: integer
        engineIdle:
          type: integer
        lastUpdated:
          type: string

    ConnectionStatus:
      type: object
      required:
        - connected
        - platform
        - lastSync
      properties:
        connected:
          type: boolean
        platform:
          type: string
        lastSync:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    Client:
      type: object
      required:
        - id
        - name
        - phone
        - isActive
        - registeredAt
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        telegramId:
          type: ["string", "null"]
        telegramUsername:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        registeredAt:
          type: string
        updatedAt:
          type: string

    ClientVehicle:
      type: object
      required:
        - id
        - clientId
        - deviceId
        - deviceName
        - plate
      properties:
        id:
          type: integer
        clientId:
          type: integer
        deviceId:
          type: string
        deviceName:
          type: string
        plate:
          type: string
        addedAt:
          type: string

    ClientWithVehicles:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/ClientVehicle"

    CreateClientInput:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
        phone:
          type: string
        telegramId:
          type: string
        telegramUsername:
          type: string
        notes:
          type: string

    UpdateClientInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        telegramId:
          type: string
        telegramUsername:
          type: string
        notes:
          type: string
        isActive:
          type: boolean

    AddVehicleInput:
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          type: string
        deviceName:
          type: string
        plate:
          type: string

    NotifyAssignmentResult:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
        reason:
          type: string

    LinkTelegramInput:
      type: object
      required:
        - telegramId
      properties:
        telegramId:
          type: string
        telegramUsername:
          type: string

    RecentEvent:
      type: object
      required:
        - id
        - platformEventId
        - deviceId
        - message
        - time
        - dispatched
        - clientNames
        - seenAt
      properties:
        id:
          type: integer
        platformEventId:
          type: integer
        deviceId:
          type: string
        deviceName:
          type: string
        plate:
          type: string
        message:
          type: string
        time:
          type: string
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        dispatched:
          type: boolean
        clientNames:
          type: array
          items:
            type: string
        seenAt:
          type: string
